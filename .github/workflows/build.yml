name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # publish releases

# one build at a time per branch, in order, so the newest build is always the "latest" release
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install SDK packages (SDK is preinstalled on the runner)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - run: chmod +x gradlew
      - name: Set up signing key (from repository secrets)
        env:
          KEYSTORE_B64: ${{ secrets.MOTIONCAM_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/motioncam.jks"
            echo "MOTIONCAM_KEYSTORE=$RUNNER_TEMP/motioncam.jks" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REPOSITORY" = "gac2003/Android-Motion-Activated-Camera" ]; then
            echo "::error::Signing secrets are missing. Add MOTIONCAM_KEYSTORE_B64, MOTIONCAM_KEYSTORE_PASSWORD and MOTIONCAM_KEY_ALIAS under Settings > Secrets and variables > Actions."
            exit 1
          else
            echo "::warning::No signing key secrets: this build uses a temporary key, so it can't be installed over a previous build. Add your own key (SETUP.md, step 2)."
          fi
      - name: Build APK
        env:
          MOTIONCAM_KEYSTORE_PASSWORD: ${{ secrets.MOTIONCAM_KEYSTORE_PASSWORD }}
          MOTIONCAM_KEY_ALIAS: ${{ secrets.MOTIONCAM_KEY_ALIAS }}
          # Your API credentials (SETUP.md): repository variables under Settings > Secrets and variables > Actions >
          # Variables. Each repository (and fork) uses only its own; missing ones switch that feature off.
          MC_APPLICATION_ID: ${{ vars.MC_APPLICATION_ID }}
          MC_FIREBASE_API_KEY: ${{ vars.MC_FIREBASE_API_KEY }}
          MC_FIREBASE_APP_ID: ${{ vars.MC_FIREBASE_APP_ID }}
          MC_FIREBASE_PROJECT_ID: ${{ vars.MC_FIREBASE_PROJECT_ID }}
          MC_FIREBASE_DB_URL: ${{ vars.MC_FIREBASE_DB_URL }}
          MC_GOOGLE_WEB_CLIENT_ID: ${{ vars.MC_GOOGLE_WEB_CLIENT_ID }}
          MC_DROPBOX_APP_KEY: ${{ vars.MC_DROPBOX_APP_KEY }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk MotionCam.apk
      - name: Show signing certificate (should match the release key's SHA-1)
        run: '"$ANDROID_HOME"/build-tools/34.0.0/apksigner verify --print-certs MotionCam.apk | grep -E "SHA-1|SHA-256|DN"'
      - uses: actions/upload-artifact@v4
        with:
          name: MotionCam-apk
          path: MotionCam.apk
      - name: Publish as the latest release
        # every repository (forks too) publishes its own builds of main as releases
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # the same version as the app: <major.minor> from version.properties, patch = builds since it started
          MM=$(grep '^major_minor=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          BASE=$(grep '^base_run=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          REPO=$(grep '^base_repo=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "$GITHUB_REPOSITORY" = "$REPO" ]; then PATCH=$(( GITHUB_RUN_NUMBER - BASE )); if [ "$PATCH" -lt 0 ]; then PATCH=0; fi
          else PATCH=$GITHUB_RUN_NUMBER; fi
          VERSION="$MM.$PATCH"
          TAG="v$VERSION"
          NOTES="MotionCam $VERSION (build ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7}): $(git log -1 --pretty=%s)

          **Install:** download MotionCam.apk below on your Android phone (Android 11+), open it and allow installing from your browser/file manager. Updates install over the previous version and keep your settings."
          gh release create "$TAG" MotionCam.apk --title "MotionCam $VERSION" --notes "$NOTES" --target "$GITHUB_SHA" --latest
          # keep only the 5 newest automatic builds (v1.1.x, and the older build-N ones)
          gh release list --limit 100 --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[].tagName' \
            | grep -E '^(v[0-9]+\.[0-9]+\.[0-9]+|build-[0-9]+)$' | tail -n +6 \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag
      - name: Start the private build (optional, see tools/private-build)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_BUILD_TOKEN }}
          PRIVATE_REPO: ${{ vars.PRIVATE_BUILD_REPO }}
        run: |
          if [ -z "$PRIVATE_TOKEN" ] || [ -z "$PRIVATE_REPO" ]; then echo "No private build set up."; exit 0; fi
          curl -sSf -X POST -H "Authorization: Bearer $PRIVATE_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$PRIVATE_REPO/dispatches" \
            -d "{\"event_type\":\"public-build\",\"client_payload\":{\"sha\":\"$GITHUB_SHA\",\"run\":\"$GITHUB_RUN_NUMBER\",\"repo\":\"$GITHUB_REPOSITORY\"}}"
          echo "Asked $PRIVATE_REPO to build this commit."
